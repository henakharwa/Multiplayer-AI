services:
  - type: web
    name: multiplayer-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/readyz
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multiplayer-ai-db
          property: connectionString
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
databases:
  - name: multiplayer-ai-db
    plan: free
    region: oregon
    databaseName: multiplayer_ai
    user: multiplayer_ai
