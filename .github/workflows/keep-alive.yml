name: Keep Render awake

# Render's free plan stops the service after ~15 minutes without traffic.
# While it is asleep, scheduled workflows don't run and live chat drops.
# This pings the public health check so the service stays up.
# Set the repository variable APP_URL (Settings → Secrets and variables →
# Actions → Variables), e.g. https://multiplayer-ai.onrender.com
# Not needed on a paid Render instance; delete this file if you upgrade.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 "${APP_URL%/}/api/healthz"
